[project]
name = "internet-mcp-server"
version = "0.1.0"
description = "Internet search MCP server using FastMCP and SerpAPI"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "google-search-results>=2.4.2",
    "python-dotenv>=1.0.1"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
